<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Miksumia</title>
<style>body { font-family: sans-serif; padding: 2rem; }</style>
</head>
<body>
<p id="msg"></p>
<script>
(function () {
  var PREFIX = "https://e4f71fa7-ff24-41e8-b9be-292df65e0885.hello.atlassian-dev.net/x1/";
  var params = new URLSearchParams(location.search);
  var state = params.get("state") || "";
  var dot = state.indexOf(".");
  var token = dot < 0 ? "" : state.slice(0, dot);
  var code = params.get("code");
  var error = params.get("error");
  var forwarded = null;
  if (/^[A-Za-z0-9_-]+$/.test(token)) {
    if (code) forwarded = new URLSearchParams({ code: code, state: state });
    else if (error) forwarded = new URLSearchParams({ error: error, state: state });
  }
  if (forwarded) {
    location.replace(PREFIX + token + "?" + forwarded.toString());
    return;
  }
  document.getElementById("msg").textContent =
    "Invalid sign-in link. Close this tab and start again from Confluence. / " +
    "Lien de connexion invalide. Fermez cet onglet et recommencez depuis Confluence.";
})();
</script>
</body>
</html>
